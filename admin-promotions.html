<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"/>
  <meta name="theme-color" content="#ffffff"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Promotions"/>
  <meta name="referrer" content="no-referrer"/>
  <script>
    /* Theme before first paint. theme-color matches the tab bar surface so
       iOS does not paint a cream strip under the nav when env() lies. */
    (function () {
      var saved = "";
      try { saved = localStorage.getItem("vjn_promo_theme") || ""; } catch (e) {}
      var dark = saved
        ? saved === "dark"
        : !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", dark ? "#1c1a17" : "#ffffff");
    })();
  </script>
  <title>Promotions – Isha Place, Vijayanagar</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="icon" type="image/png" href="assets/logo.png"/>
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=vjn2"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="admin-promotions.css?v=set-acc1"/>
  <link rel="stylesheet" href="sandesha/css/embedded.css?v=toast-1"/>
  <link rel="stylesheet" href="banner-form.css?v=2"/>
  <link rel="stylesheet" href="admin-promotions-minimal.css?v=6"/>
  <script src="config.js"></script>
  <script src="pi-promos.js?v=2"></script>
</head>
<body>
  <main class="stage">
    <div class="device">
    <div class="phone" id="app">
      <div class="hdr">
        <div class="hdr-row">
          <button type="button" class="ic hdr-back" id="hdrBack" aria-label="Back to More" hidden>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <div class="hdr-title">
            <h1 id="pageTitle">Posts</h1>
            <div class="kicker" id="dayTitle">Today</div>
          </div>
          <div class="icons">
            <button type="button" class="fab" id="fab">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              New post
            </button>
          </div>
        </div>

        <div id="sandesha-pairing-banner" class="pairing-banner embedded hidden" role="status" aria-live="polite">
          <div class="pairing-banner-title">Link WhatsApp</div>
          <p data-pairing-help></p>
          <div class="pairing-code" data-pairing-code hidden>—</div>
          <img class="pairing-qr hidden" data-pairing-qr alt="WhatsApp QR code" width="180" height="180"/>
        </div>

        <div class="bar" id="bar">
          <div class="bar-line"><div class="bar-fill" id="fill"></div></div>
          <div class="bar-txt"><span id="btL"></span><span id="btR"></span></div>
        </div>

        <div class="tabs" role="tablist" aria-label="Day">
          <div class="tabs-thumb" id="tabsThumb" aria-hidden="true"></div>
          <div class="tabrow base" id="tabsBase"></div>
          <div class="tabrow active" id="tabsActive" hidden></div>
        </div>
      </div>

      <div class="scroll" id="scroll"></div>

      <div class="promo-panel" id="sandeshaSchedule" aria-label="WhatsApp schedule"></div>
      <div class="promo-panel" id="sandeshaSend" aria-label="Compose a WhatsApp message"></div>
      <div class="promo-panel" id="promoBanner" aria-label="Homepage banner"></div>
      <div class="promo-panel" id="sandeshaReach" aria-label="Message reach"></div>
      <div class="promo-panel" id="sandeshaServer" aria-label="More">
        <div id="moreMain">
          <section class="more-group" aria-label="WhatsApp">
            <div id="sandeshaApiHost"></div>
          </section>
          <section class="more-group" aria-labelledby="mgAud">
            <h2 class="more-h" id="mgAud">Where posts go</h2>
            <div id="promoPlanningHost"></div>
            <div id="promoSetsHost"></div>
          </section>
          <section class="more-group" aria-labelledby="mgTools">
            <h2 class="more-h" id="mgTools">Tools</h2>
            <div class="ios-group">
              <button type="button" class="ios-row-btn" id="moreBanner" data-promo-open="banner">
                <span class="pa-copy"><span class="pa-title">Homepage banner</span></span><svg class="pa-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
              </button>
              <button type="button" class="ios-row-btn" id="promoActivityOpen">
                <span class="pa-copy"><span class="pa-title">Sandesha activity</span></span><svg class="pa-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
              </button>
              <button type="button" class="ios-row-btn" id="notifyBtn" aria-label="Notifications" aria-pressed="false">
                <span class="pa-copy"><span class="pa-title">Notifications</span></span>
                <span class="bdg" id="notifyDot" hidden></span>
              </button>
            </div>
          </section>
          <section class="more-group" aria-labelledby="mgDev">
            <h2 class="more-h" id="mgDev">This device</h2>
            <div class="ios-group">
              <div class="set-appear">
                <span id="themeLbl">Appearance</span>
                <div class="toggle" role="group" aria-labelledby="themeLbl">
                  <button type="button" id="themeLight" aria-pressed="true">Light</button>
                  <button type="button" id="themeDark" aria-pressed="false">Dark</button>
                </div>
              </div>
            </div>
            <button type="button" class="set-signout" id="logoutBtn">Sign out</button>
          </section>
        </div>
        <div id="promoActivity" hidden>
          <button type="button" class="pa-back" id="promoActivityBack">More</button>
          <h2 class="pa-heading">Sandesha activity</h2>
          <div class="pa-filters" role="tablist" aria-label="Result">
            <button type="button" class="on" data-pa-status="all">All</button>
            <button type="button" data-pa-status="ok">Success</button>
            <button type="button" data-pa-status="fail">Failed</button>
          </div>
          <p class="pa-meta" id="promoActivityMeta"></p>
          <div id="promoActivityList"></div>
        </div>
      </div>

      <div class="toast" id="toast"><span id="tmsg"></span><button type="button" id="undo">Undo</button></div>

      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" inert></div>
    </div>

    <nav class="tabbar" aria-label="Promotions sections">
      <button type="button" class="on" data-promo-mode="board">
        <svg width="24" height="24" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M160,56v96a8,8,0,0,1-8,8H112a8,8,0,0,1-8-8V56a8,8,0,0,1,8-8h40A8,8,0,0,1,160,56Zm64-8H184a8,8,0,0,0-8,8v52a4,4,0,0,0,4,4h48a4,4,0,0,0,4-4V56A8,8,0,0,0,224,48Zm4,80H180a4,4,0,0,0-4,4v44a16,16,0,0,0,16,16h24a16,16,0,0,0,16-16V132A4,4,0,0,0,228,128ZM80,48H40a8,8,0,0,0-8,8v52a4,4,0,0,0,4,4H84a4,4,0,0,0,4-4V56A8,8,0,0,0,80,48Zm4,80H36a4,4,0,0,0-4,4v76a16,16,0,0,0,16,16H72a16,16,0,0,0,16-16V132A4,4,0,0,0,84,128Z"/></svg>
        <span>Posts</span>
      </button>
      <button type="button" data-promo-mode="schedule">
        <svg width="24" height="24" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M208,32H184V24a8,8,0,0,0-16,0v8H88V24a8,8,0,0,0-16,0v8H48A16,16,0,0,0,32,48V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V48A16,16,0,0,0,208,32Zm0,48H48V48H72v8a8,8,0,0,0,16,0V48h80v8a8,8,0,0,0,16,0V48h24Z"/></svg>
        <span>Schedule</span>
      </button>
      <button type="button" data-promo-mode="send">
        <svg width="24" height="24" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M227.31,73.37,182.63,28.68a16,16,0,0,0-22.63,0L36.69,152A15.86,15.86,0,0,0,32,163.31V208a16,16,0,0,0,16,16H92.69A15.86,15.86,0,0,0,104,219.31L227.31,96a16,16,0,0,0,0-22.63ZM192,108.68,147.31,64l24-24L216,84.68Z"/></svg>
        <span>Compose</span>
        <span class="tab-bdg" id="sandeshaDot" hidden></span>
      </button>
      <button type="button" data-promo-mode="reach">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
        <span>Reach</span>
      </button>
      <button type="button" data-promo-mode="server">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></svg>
        <span>More</span>
      </button>
    </nav>
    </div>
  </main>

  <div id="safe-bottom-paint" aria-hidden="true"></div>

  <div class="compose-scrim gone" id="composeScrim" aria-hidden="true"></div>
  <div class="compose gone" id="compose" role="dialog" aria-modal="true" aria-hidden="true"
       aria-labelledby="composeTitle" inert>

    <div class="grab" aria-hidden="true"></div>
    <header class="compose-head">
      <div class="compose-head-row">
        <h2 id="composeTitle">New post</h2>
        <button type="button" class="ic" id="composeClose" aria-label="Close">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <p class="compose-meta" id="composeMeta"></p>
    </header>

    <div class="compose-body">
      <div class="wa-link-note" data-wa-link hidden>
        <p data-wa-link-text>WhatsApp isn’t connected</p>
        <button type="button" data-wa-link-settings>Link</button>
      </div>
      <p class="compose-err" id="composeErr" role="alert" hidden></p>

      <section class="compose-card">
        <div class="compose-card-head">
          <div class="compose-card-head-main">
            <label class="compose-card-title" for="composeMessage">Message</label>
            <button type="button" class="compose-paste" id="composePaste">Paste</button>
          </div>
          <span class="compose-count" id="composeCount" aria-hidden="true"></span>
        </div>
        <textarea id="composeMessage" rows="6"></textarea>
      </section>

      <section class="compose-card">
        <div class="compose-card-head">
          <h3 class="compose-card-title">Flyer</h3>
          <span class="compose-flag" id="composeFlyerReq" hidden>Required</span>
        </div>
        <input type="file" id="composeFlyerFile" accept="image/*" class="compose-file"/>
        <label for="composeFlyerFile" class="compose-drop" id="composeDrop">
          <img id="composeFlyerPreview" class="compose-preview" alt="" referrerpolicy="no-referrer" hidden/>
          <span class="compose-drop-ph">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="8.5" cy="8.5" r="1.4"/><path d="M21 15l-5-5L5 21"/></svg>
            <span>Choose flyer</span>
          </span>
          <span class="compose-drop-cta" aria-hidden="true">Replace</span>
        </label>
        <div class="compose-drop-foot">
          <span class="compose-flyer-name" id="composeFlyerName"></span>
          <button type="button" class="compose-reset" id="composeFlyerReset" hidden>Use Programs photo</button>
        </div>
      </section>

      <section class="compose-card">
        <h3 class="compose-card-title">When</h3>
        <div class="compose-seg" id="composeSeg">
          <span class="compose-seg-ind" aria-hidden="true"></span>
          <label class="compose-seg-opt">
            <input type="radio" name="composeWhen" value="save" checked/>
            <span>Save for later</span>
          </label>
          <label class="compose-seg-opt">
            <input type="radio" name="composeWhen" value="schedule" id="composeWhenSchedule"/>
            <span>Schedule</span>
          </label>
        </div>
        <div class="compose-schedule" id="composeSchedule" inert>
          <div class="compose-schedule-in">
            <label class="compose-label" for="composeDate">Date</label>
            <input type="date" id="composeDate" class="compose-date"/>
            <p class="compose-date-hint" id="composeDateHint" aria-live="polite"></p>
            <label class="compose-label" id="composeTimeLabel" for="composeHour">Time</label>
            <div class="compose-time" role="group" aria-labelledby="composeTimeLabel">
              <input id="composeHour" class="compose-time-num" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="Hour" value="10"/>
              <span class="compose-time-colon" aria-hidden="true">:</span>
              <input id="composeMinute" class="compose-time-num" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="Minute" value="00"/>
              <div class="compose-ampm" role="group" aria-label="AM or PM">
                <button type="button" class="on" data-ampm="AM" aria-pressed="true">AM</button>
                <button type="button" data-ampm="PM" aria-pressed="false">PM</button>
              </div>
            </div>
            <input type="hidden" id="composeTime" value="10:00"/>

            <span class="compose-label">Audience</span>
            <button type="button" class="compose-aud" id="composeAud">
              <span class="compose-aud-body">
                <span class="compose-aud-name" id="composeAudName">Loading lists…</span>
                <span class="compose-aud-sub" id="composeAudSub"></span>
              </span>
              <span class="compose-aud-n"><b id="composeAudCount">0</b><small>Reach</small></span>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
            </button>
          </div>
        </div>
      </section>
    </div>

    <footer class="compose-foot">
      <button type="button" class="b" id="composeCancel">Cancel</button>
      <button type="button" class="b pri" id="composeSave">Save</button>
    </footer>
  </div>

  <div id="sandeshaToastContainer" aria-live="polite"></div>

  <script src="ptr.js?v=1"></script>
  <script src="drafts.js?v=1"></script>
  <script src="admin-promotions.js?v=no-past-8"></script>
  <script type="module" src="sandesha/js/promo-shell.js?v=57"></script>
</body>
</html>
